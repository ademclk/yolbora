spring:
  application:
    name: yolbora-api

server:
  port: 8080

management:
  endpoints:
    web:
      exposure: 
        include: health,info,prometheus
  endpoint: 
    health:
      show-details: always
      probes:
        enabled: true
  metrics: 
    tags: 
      application: ${spring.application.name}
